<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{% block meta_description %}The Porto Map — hand-drawn maps, self-guided walking routes and intimate guided tours of Porto by artist Sharon Jemima.{% endblock %}" />
  <title>{% block title %}The Porto Map{% endblock %} — Sharon Jemima</title>

  {% load static %}
  <link rel="stylesheet" href="{% static 'css/main.css' %}?v=4" />
  <link rel="stylesheet" href="{% static 'css/animations.css' %}?v=4" />

  {% block extra_head %}{% endblock %}
</head>
<body>

  {% include "partials/nav.html" %}

  {% if messages %}
    <div class="container" style="padding-top: 100px; padding-bottom: 0;">
      {% for message in messages %}
        <div class="alert alert--{{ message.tags|default:'success' }}">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}

  <main>
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}

  <script src="{% static 'js/main.js' %}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
